<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Planning Hebdomadaire</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/fr.global.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
    }
    #top-bar {
      height: 42px;
      padding: 6px 12px;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      gap: 12px;
      align-items: center;
      box-sizing: border-box;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #333333;
    }
    .filter-item select {
      padding: 4px 8px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      background: #ffffff;
    }
    #calendar {
      height: calc(100vh - 44px) !important;
      padding: 4px 8px;
      box-sizing: border-box;
    }
    .fc-event {
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 11px;
    }
    .fc-day-sat, .fc-day-sun { background-color: #f1f3f5 !important; }
    .bg-vacances { background-color: #fff8e1 !important; opacity: 0.8; }
    .bg-ferie { background-color: #fde8e8 !important; opacity: 0.8; }

    /* Fenêtre modale */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 8px;
      width: 440px;
      max-width: 90vw;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .modal-box h3 { margin-top: 0; margin-bottom: 14px; color: #1f4e79; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #333; }
    .form-group input, .form-group select {
      width: 100%; padding: 7px; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; font-size: 13px; background: #fff;
    }
    .modal-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding-top: 10px; border-top: 1px solid #eee;
    }
    .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary { background: #1f4e79; color: #ffffff; }
    .btn-secondary { background: #e0e0e0; color: #333333; }
    .btn-danger { background: #dc3545; color: #ffffff; }

    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      #top-bar, .fc-header-toolbar, #modal-overlay { display: none !important; }
      body, html { height: auto !important; overflow: visible !important; }
      #calendar { height: auto !important; }
      .fc-scroller { overflow: visible !important; height: auto !important; }
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div class="filter-item">
      <label for="filter-classe">Classe :</label>
      <select id="filter-classe" onchange="refreshCalendar()">
        <option value="">Toutes les classes</option>
      </select>
    </div>
    <div class="filter-item">
      <label for="filter-eleve">Élève :</label>
      <select id="filter-eleve" onchange="refreshCalendar()">
        <option value="">Tous les élèves</option>
      </select>
    </div>
    <div style="margin-left: auto;">
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimer A4</button>
    </div>
  </div>

  <div id="calendar"></div>

  <!-- Modale -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title">Programmer une séance</h3>
      <input type="hidden" id="edit-id" />
      
      <div class="form-group">
        <label>Activité / Entretien / Bilan</label>
        <select id="modal-activite" onchange="toggleNewActivity(this.value)">
          <option value="">-- Choisir une activité --</option>
          <option value="__NEW__">➕ Créer une nouvelle activité...</option>
        </select>
      </div>

      <div class="form-group" id="group-new-activite" style="display:none;">
        <label>Nom de la nouvelle activité</label>
        <input type="text" id="new-activite-nom" placeholder="Ex: Boxe, Remobilisation..." />
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Lieu</label>
          <select id="modal-lieu">
            <option value="UJPE">UJPE</option>
            <option value="UEAJ">UEAJ</option>
            <option value="Extérieur">Extérieur</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>Référent</label>
          <select id="modal-referent">
            <option value="">-- Aucun --</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Heure de début</label>
          <select id="modal-time-start">
            <option value="08:00">08 h 00</option>
            <option value="08:30">08 h 30</option>
            <option value="09:00">09 h 00</option>
            <option value="09:30">09 h 30</option>
            <option value="10:00">10 h 00</option>
            <option value="10:30">10 h 30</option>
            <option value="11:00">11 h 00</option>
            <option value="11:30">11 h 30</option>
            <option value="12:00">12 h 00</option>
            <option value="12:30">12 h 30</option>
            <option value="13:00">13 h 00</option>
            <option value="13:30">13 h 30</option>
            <option value="14:00">14 h 00</option>
            <option value="14:30">14 h 30</option>
            <option value="15:00">15 h 00</option>
            <option value="15:30">15 h 30</option>
            <option value="16:00">16 h 00</option>
            <option value="16:30">16 h 30</option>
            <option value="17:00">17 h 00</option>
            <option value="17:30">17 h 30</option>
            <option value="18:00">18 h 00</option>
            <option value="18:30">18 h 30</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>Durée</label>
          <select id="modal-duree">
            <option value="30">0 h 30</option>
            <option value="60" selected>1 h 00</option>
            <option value="90">1 h 30</option>
            <option value="120">2 h 00</option>
            <option value="150">2 h 30</option>
            <option value="180">3 h 00</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Affecter une classe entière</label>
        <select id="modal-classe" onchange="if(this.value) document.getElementById('modal-eleve').value='';">
          <option value="">-- Aucun groupe automatique --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ou affecter un élève individuel</label>
        <select id="modal-eleve">
          <option value="">-- Aucun élève --</option>
        </select>
      </div>

      <div class="modal-actions">
        <button id="btn-delete" class="btn btn-danger" style="display:none;" onclick="deleteSession()">Supprimer</button>
        <div style="display:flex; gap:8px; margin-left:auto;">
          <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="saveSession()">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    let rawSeances = [];
    let officialEvents = [];
    let elevesList = [];
    let referentsList = [];
    let inscriptionsList = [];
    let selectedDateStr = "";

    function toGristSec(d) { return Math.floor(d.getTime() / 1000); }
    function fromGristDate(v) {
      if (!v) return null;
      return typeof v === 'number' ? new Date(v * 1000) : new Date(v);
    }
    function addDays(d, n) {
      const res = new Date(d);
      res.setDate(res.getDate() + n);
      return res;
    }

    function toggleNewActivity(val) {
      const isNew = val === '__NEW__';
      document.getElementById('group-new-activite').style.display = isNew ? 'block' : 'none';
      if (isNew) document.getElementById('new-activite-nom').focus();
    }

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'fr',
        initialView: 'timeGridWeek',
        firstDay: 1,
        slotMinTime: '08:00:00',
        slotMaxTime: '18:30:00',
        slotDuration: '00:30:00',
        allDaySlot: true,
        height: '100%',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay'
        },
        buttonText: { today: "Aujourd'hui", week: 'Semaine', day: 'Jour' },
        editable: true,
        selectable: true,

        select: function(info) {
          openCreateModal(info);
          calendar.unselect();
        },
        eventClick: function(info) {
          if (info.event.display === 'background' || String(info.event.id).startsWith('off_')) return;
          openEditModal(info.event.id);
        },
        eventDrop: function(info) { updateTimes(info.event); },
        eventResize: function(info) { updateTimes(info.event); }
      });

      calendar.render();

      // Initialisation Grist sans forcer le mapping des colonnes
      grist.ready({ requiredAccess: 'full' });

      loadReferences();

      grist.onRecords(function(records) {
        rawSeances = records || [];
        populateActivityList();
        loadInscriptionsAndRefresh();
      });
    });

    async function loadReferences() {
      try {
        const off = await grist.docApi.fetchTable('Calendrier_Officiel');
        officialEvents = [];
        if (off && off.id) {
          for (let i = 0; i < off.id.length; i++) {
            const deb = fromGristDate(off.Date_Debut[i]);
            const fin = fromGristDate(off.Date_Fin[i]) || deb;
            const nom = off.Nom ? off.Nom[i] : 'Fermeture';
            const type = off.Type ? off.Type[i] : '';
            const isVac = (type === 'Vacances scolaires' || type === 'Vacances');

            if (deb) {
              const finInclusive = addDays(fin, 1);
              officialEvents.push({
                id: 'off_bg_' + off.id[i],
                start: deb, end: finInclusive,
                allDay: true, display: 'background',
                className: isVac ? 'bg-vacances' : 'bg-ferie'
              });
              officialEvents.push({
                id: 'off_lbl_' + off.id[i],
                title: (isVac ? '🏖️ ' : '🔴 ') + nom,
                start: deb, end: addDays(deb, 1),
                allDay: true, editable: false,
                backgroundColor: isVac ? '#fff3cd' : '#f8d7da',
                textColor: '#333333', borderColor: isVac ? '#ffeeba' : '#f5c6cb'
              });
            }
          }
        }
      } catch (e) {
        console.warn("Calendrier_Officiel non chargé :", e);
      }

      try {
        const refs = await grist.docApi.fetchTable('Referents');
        referentsList = [];
        const refSelect = document.getElementById('modal-referent');
        refSelect.innerHTML = '<option value="">-- Aucun --</option>';
        if (refs && refs.id) {
          for (let i = 0; i < refs.id.length; i++) {
            const prenom = refs.Prenom ? refs.Prenom[i] : ('Réf ' + refs.id[i]);
            referentsList.push({ id: refs.id[i], prenom: prenom });
            const opt = document.createElement('option');
            opt.value = refs.id[i];
            opt.textContent = prenom;
            refSelect.appendChild(opt);
          }
        }
      } catch (e) {
        console.warn("Referents non chargés :", e);
      }

      try {
        const elvs = await grist.docApi.fetchTable('Eleves');
        elevesList = [];
        const classesSet = new Set();
        const modEleve = document.getElementById('modal-eleve');
        const filterEleve = document.getElementById('filter-eleve');
        modEleve.innerHTML = '<option value="">-- Aucun élève --</option>';
        filterEleve.innerHTML = '<option value="">Tous les élèves</option>';

        if (elvs && elvs.id) {
          for (let i = 0; i < elvs.id.length; i++) {
            const init = elvs.Initiales ? elvs.Initiales[i] : ((elvs.Prenom ? elvs.Prenom[i] : '') + ' ' + (elvs.Nom ? elvs.Nom[i] : ''));
            const classe = elvs.Classe ? elvs.Classe[i] : '';
            elevesList.push({ id: elvs.id[i], initiales: init, classe: classe });
            if (classe) classesSet.add(classe);

            const opt = document.createElement('option');
            opt.value = elvs.id[i];
            opt.textContent = init + (classe ? ` (${classe})` : '');
            modEleve.appendChild(opt);

            const optF = document.createElement('option');
            optF.value = elvs.id[i];
            optF.textContent = init + (classe ? ` (${classe})` : '');
            filterEleve.appendChild(optF);
          }
        }

        const modClasse = document.getElementById('modal-classe');
        const filterClasse = document.getElementById('filter-classe');
        modClasse.innerHTML = '<option value="">-- Aucun groupe automatique --</option>';
        filterClasse.innerHTML = '<option value="">Toutes les classes</option>';

        Array.from(classesSet).sort().forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'Toute la classe ' + c;
          modClasse.appendChild(opt);

          const optF = document.createElement('option');
          optF.value = c;
          optF.textContent = c;
          filterClasse.appendChild(optF);
        });
      } catch (e) {
        console.warn("Eleves non chargés :", e);
      }

      refreshCalendar();
    }

    async function loadInscriptionsAndRefresh() {
      try {
        const insc = await grist.docApi.fetchTable('Inscriptions');
        inscriptionsList = [];
        if (insc && insc.id && insc.Seance && insc.Eleve) {
          for (let i = 0; i < insc.id.length; i++) {
            inscriptionsList.push({
              seanceId: insc.Seance[i],
              eleveId: insc.Eleve[i]
            });
          }
        }
      } catch (e) {}
      refreshCalendar();
    }

    function populateActivityList() {
      const distinctNames = new Set(['Sport', 'Entretien santé', 'Cinéma']);
      rawSeances.forEach(r => {
        if (r.Titre && r.Titre.trim() !== '') distinctNames.add(r.Titre.trim());
      });

      const actSelect = document.getElementById('modal-activite');
      const cur = actSelect.value;
      actSelect.innerHTML = '<option value="">-- Choisir une activité --</option><option value="__NEW__">➕ Créer une nouvelle activité...</option>';

      Array.from(distinctNames).sort().forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        actSelect.appendChild(opt);
      });
      if (cur) actSelect.value = cur;
    }

    function refreshCalendar() {
      if (!calendar) return;
      calendar.removeAllEvents();
      calendar.addEventSource(officialEvents);

      const fClasse = document.getElementById('filter-classe').value;
      const fEleveId = document.getElementById('filter-eleve').value ? parseInt(document.getElementById('filter-eleve').value, 10) : null;

      const seanceEvents = rawSeances.map(r => {
        const row = grist.mapColumnNames ? grist.mapColumnNames(r) : r;
        const seanceId = r.id;

        if (fEleveId) {
          const isInscrit = inscriptionsList.some(i => i.seanceId === seanceId && i.eleveId === fEleveId);
          if (!isInscrit) return null;
        } else if (fClasse) {
          const elevesDeLaClasse = elevesList.filter(e => e.classe === fClasse).map(e => e.id);
          const hasEleveClasse = inscriptionsList.some(i => i.seanceId === seanceId && elevesDeLaClasse.includes(i.eleveId));
          if (!hasEleveClasse) return null;
        }

        let refNom = '';
        if (r.Referents) {
          const refId = Array.isArray(r.Referents) ? (r.Referents[1] || r.Referents[0]) : r.Referents;
          const foundRef = referentsList.find(ref => ref.id === refId);
          if (foundRef) refNom = ` - ${foundRef.prenom}`;
        }

        const d = fromGristDate(row.Debut || r.Debut);
        const f = fromGristDate(row.Fin || r.Fin);
        const lieu = r.Lieu ? ` [${r.Lieu}]` : '';

        return {
          id: String(r.id),
          title: `${row.Titre || r.Titre || 'Séance'}${lieu}${refNom}`,
          start: d,
          end: f,
          backgroundColor: '#1f4e79',
          borderColor: '#163857'
        };
      }).filter(e => e && e.start && e.end);

      calendar.addEventSource(seanceEvents);
    }

    function snapToSlot(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const roundedM = m < 30 ? '00' : '30';
      return `${String(h).padStart(2, '0')}:${roundedM}`;
    }

    function openCreateModal(info) {
      document.getElementById('edit-id').value = "";
      document.getElementById('modal-title').textContent = "Programmer une séance";
      document.getElementById('modal-activite').value = "";
      document.getElementById('group-new-activite').style.display = 'none';
      document.getElementById('new-activite-nom').value = "";
      document.getElementById('modal-lieu').value = "UJPE";
      document.getElementById('modal-referent').value = "";
      document.getElementById('modal-classe').value = "";
      document.getElementById('modal-eleve').value = "";
      document.getElementById('btn-delete').style.display = 'none';

      selectedDateStr = info.startStr.split('T')[0];
      const rawTime = info.startStr.split('T')[1].substring(0, 5);
      const slot = snapToSlot(rawTime);
      const startSelect = document.getElementById('modal-time-start');
      if (startSelect.querySelector(`option[value="${slot}"]`)) startSelect.value = slot;

      const diffMin = Math.round((info.end - info.start) / 60000);
      const dureeSelect = document.getElementById('modal-duree');
      dureeSelect.value = (diffMin >= 30 && diffMin <= 180) ? String(diffMin) : "60";

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openEditModal(rowId) {
      const record = rawSeances.find(r => String(r.id) === String(rowId));
      if (!record) return;

      document.getElementById('edit-id').value = rowId;
      document.getElementById('modal-title').textContent = "Modifier la séance";
      document.getElementById('btn-delete').style.display = 'block';

      const d = fromGristDate(record.Debut);
      const f = fromGristDate(record.Fin);
      selectedDateStr = d.toISOString().split('T')[0];

      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      const slot = snapToSlot(timeStr);
      const startSelect = document.getElementById('modal-time-start');
      if (startSelect.querySelector(`option[value="${slot}"]`)) startSelect.value = slot;

      const diffMin = Math.round((f - d) / 60000);
      const dureeSelect = document.getElementById('modal-duree');
      dureeSelect.value = (diffMin >= 30 && diffMin <= 180) ? String(diffMin) : "60";

      document.getElementById('modal-activite').value = record.Titre || "";
      document.getElementById('group-new-activite').style.display = 'none';
      document.getElementById('modal-lieu').value = record.Lieu || "UJPE";

      if (record.Referents) {
        const refId = Array.isArray(record.Referents) ? (record.Referents[1] || record.Referents[0]) : record.Referents;
        document.getElementById('modal-referent').value = refId || "";
      } else {
        document.getElementById('modal-referent').value = "";
      }

      document.getElementById('modal-classe').value = "";
      document.getElementById('modal-eleve').value = "";

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    async function saveSession() {
      try {
        let titre = document.getElementById('modal-activite').value;
        if (titre === '__NEW__') {
          titre = document.getElementById('new-activite-nom').value.trim();
          if (!titre) { alert("Veuillez indiquer un nom d'activité."); return; }
        }
        if (!titre) { alert("Veuillez choisir ou saisir une activité."); return; }

        const lieu = document.getElementById('modal-lieu').value;
        const refVal = document.getElementById('modal-referent').value;
        const refId = refVal ? parseInt(refVal, 10) : null;
        const tStart = document.getElementById('modal-time-start').value;
        const dureeMin = parseInt(document.getElementById('modal-duree').value, 10);

        const debDate = new Date(`${selectedDateStr}T${tStart}:00`);
        const finDate = new Date(debDate.getTime() + dureeMin * 60000);

        const editId = document.getElementById('edit-id').value;
        let seanceId = editId ? parseInt(editId, 10) : null;

        const payload = {
          Titre: titre,
          Lieu: lieu,
          Debut: toGristSec(debDate),
          Fin: toGristSec(finDate)
        };
        if (refId) payload.Referents = ['L', refId];

        if (seanceId) {
          await grist.selectedTable.update({ id: seanceId, fields: payload });
        } else {
          const result = await grist.docApi.applyUserActions([['AddRecord', 'Seances', null, payload]]);
          seanceId = result[0];
        }

        const classe = document.getElementById('modal-classe').value;
        const eleveId = document.getElementById('modal-eleve').value;

        if (seanceId) {
          if (classe) {
            const inscrits = elevesList.filter(e => e.classe === classe);
            const inscriptActions = inscrits.map(e => ['AddRecord', 'Inscriptions', null, { Seance: seanceId, Eleve: e.id }]);
            if (inscriptActions.length) await grist.docApi.applyUserActions(inscriptActions);
          } else if (eleveId) {
            await grist.docApi.applyUserActions([
              ['AddRecord', 'Inscriptions', null, { Seance: seanceId, Eleve: parseInt(eleveId, 10) }]
            ]);
          }
        }

        closeModal();
        loadInscriptionsAndRefresh();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + (err.message || err));
      }
    }

    async function deleteSession() {
      const editId = document.getElementById('edit-id').value;
      if (!editId) return;
      if (confirm("Supprimer cette séance ?")) {
        try {
          await grist.selectedTable.destroy([parseInt(editId, 10)]);
          closeModal();
        } catch (e) {
          alert("Erreur lors de la suppression : " + e.message);
        }
      }
    }

    function updateTimes(event) {
      grist.selectedTable.update({
        id: parseInt(event.id, 10),
        fields: {
          Debut: toGristSec(event.start),
          Fin: toGristSec(event.end)
        }
      });
    }
  </script>
</body>
</html>
