<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Planning Hebdomadaire</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/fr.global.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      box-sizing: border-box;
      background: #ffffff;
    }
    #calendar {
      height: 100%;
    }
    .fc-event {
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 4px;
    }
    /* Style pour les jours fériés et vacances en arrière-plan */
    .bg-ferie {
      background-color: rgba(220, 53, 69, 0.12) !important;
      border: none !important;
    }
    .bg-vacances {
      background-color: rgba(255, 193, 7, 0.18) !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <script>
    let calendar;
    let officialEvents = [];
    let seancesEvents = [];

    function parseGristDate(val) {
      if (!val) return null;
      if (typeof val === 'number') {
        return new Date(val * 1000);
      }
      return new Date(val);
    }

    // Ajoute un jour pour les dates de fin exclusives (FullCalendar allDay)
    function addOneDay(date) {
      const d = new Date(date);
      d.setDate(d.getDate() + 1);
      return d;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'fr',
        initialView: 'timeGridWeek',
        firstDay: 1,
        slotMinTime: '08:00:00',
        slotMaxTime: '19:00:00',
        slotDuration: '00:30:00',
        allDaySlot: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: "Aujourd'hui",
          week: 'Semaine',
          day: 'Jour'
        },
        editable: true,
        selectable: true,

        // Clic sur un créneau libre
        select: function(info) {
          const titre = prompt("Titre de la nouvelle activité / entretien :");
          if (titre) {
            grist.selectedTable.create({
              fields: {
                Titre: titre,
                Debut: info.startStr,
                Fin: info.endStr
              }
            });
          }
          calendar.unselect();
        },

        // Déplacement ou étirement de bloc
        eventResize: function(info) {
          if (info.event.display === 'background') return;
          updateGristEvent(info.event);
        },
        eventDrop: function(info) {
          if (info.event.display === 'background') return;
          updateGristEvent(info.event);
        },

        // Sélection d'une séance pour piloter la fiche et les inscriptions
        eventClick: function(info) {
          if (info.event.display === 'background') return;
          grist.setCursorPos({ rowId: parseInt(info.event.id) });
        }
      });

      calendar.render();

      function updateGristEvent(event) {
        grist.selectedTable.update({
          id: parseInt(event.id),
          fields: {
            Debut: event.startStr,
            Fin: event.endStr
          }
        });
      }

      function refreshAllEvents() {
        calendar.removeAllEvents();
        calendar.addEventSource(officialEvents);
        calendar.addEventSource(seancesEvents);
      }

      // Initialisation avec accès complet à la base
      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'Debut', title: 'Début (DateTime)' },
          { name: 'Fin', title: 'Fin (DateTime)' },
          { name: 'Titre', title: 'Titre' }
        ]
      });

      // 1. Chargement des jours fériés et vacances scolaires
      grist.docApi.fetchTable('Calendrier_Officiel').then(function(data) {
        officialEvents = [];
        const nbRows = data.id.length;
        for (let i = 0; i < nbRows; i++) {
          const dDeb = parseGristDate(data.Date_Debut[i]);
          let dFin = parseGristDate(data.Date_Fin[i]);
          const type = data.Type ? data.Type[i] : '';
          const nom = data.Nom ? data.Nom[i] : 'Fermeture';

          if (dDeb) {
            // FullCalendar allDay exclut la date de fin : on ajoute un jour
            const endInclusive = dFin ? addOneDay(dFin) : addOneDay(dDeb);
            const isVac = (type === 'Vacances scolaires' || type === 'Vacances');

            officialEvents.push({
              id: 'off_' + data.id[i],
              title: nom,
              start: dDeb,
              end: endInclusive,
              allDay: true,
              display: 'background',
              className: isVac ? 'bg-vacances' : 'bg-ferie'
            });

            // Ajoute un libellé dans la ligne "Toute la journée" (allDay)
            officialEvents.push({
              id: 'off_lbl_' + data.id[i],
              title: (isVac ? '🏖️ ' : '🔴 ') + nom,
              start: dDeb,
              end: endInclusive,
              allDay: true,
              editable: false,
              backgroundColor: isVac ? '#fff3cd' : '#f8d7da',
              textColor: '#000000',
              borderColor: isVac ? '#ffeeba' : '#f5c6cb'
            });
          }
        }
        refreshAllEvents();
      }).catch(function(err) {
        console.warn("Table Calendrier_Officiel non accessible ou vide :", err);
      });

      // 2. Chargement des séances d'activités
      grist.onRecords(function(records, mappings) {
        seancesEvents = records.map(r => {
          const row = grist.mapColumnNames ? grist.mapColumnNames(r) : r;
          const debut = row ? (row.Debut || r.Debut) : r.Debut;
          const fin = row ? (row.Fin || r.Fin) : r.Fin;
          const titre = row ? (row.Titre || r.Titre) : r.Titre;

          return {
            id: String(r.id),
            title: titre || 'Sans titre',
            start: parseGristDate(debut),
            end: parseGristDate(fin),
            backgroundColor: '#1f4e79',
            borderColor: '#163857',
            editable: true
          };
        }).filter(e => e.start && e.end);

        refreshAllEvents();
      });
    });
  </script>
</body>
</html>
