<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Planning Hebdomadaire</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/fr.global.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; overflow: hidden; background: #ffffff;
    }
    #calendar { height: 100vh; padding: 6px; box-sizing: border-box; }
    .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; }
    .fc-day-sat, .fc-day-sun { background-color: #f1f3f5 !important; }
    .bg-vacances { background-color: #fff8e1 !important; opacity: 0.8; }
    .bg-ferie { background-color: #fde8e8 !important; opacity: 0.8; }

    #modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45); z-index: 9999;
      justify-content: center; align-items: center;
    }
    .modal-box {
      background: #ffffff; border-radius: 8px; width: 440px; max-width: 90vw;
      padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .modal-box h3 { margin-top: 0; margin-bottom: 14px; color: #1f4e79; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #333333; }
    .form-group input, .form-group select {
      width: 100%; padding: 7px; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; font-size: 13px;
    }
    .modal-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 18px; padding-top: 12px; border-top: 1px solid #eeeeee;
    }
    .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary { background: #1f4e79; color: #ffffff; }
    .btn-secondary { background: #e0e0e0; color: #333333; }
    .btn-danger { background: #dc3545; color: #ffffff; }
  </style>
</head>
<body>
  <div id="calendar"></div>

  <!-- Boîte modale -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title">Programmer une séance</h3>
      <input type="hidden" id="edit-id" />
      
      <div class="form-group">
        <label>Activité / Entretien / Bilan</label>
        <select id="modal-activite">
          <option value="">-- Choisir une activité --</option>
          <option value="__NEW__">➕ Créer une nouvelle activité...</option>
        </select>
      </div>

      <div class="form-group" id="group-new-activite" style="display:none;">
        <label>Nom de la nouvelle activité</label>
        <input type="text" id="new-activite-nom" placeholder="Ex: Remobilisation, Bilan, Atelier..." />
      </div>

      <div class="form-group">
        <label>Lieu</label>
        <select id="modal-lieu">
          <option value="UJPE">UJPE</option>
          <option value="UEAJ">UEAJ</option>
          <option value="Extérieur">Extérieur</option>
        </select>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>Heure de début</label>
          <select id="modal-time-start"></select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>Durée</label>
          <select id="modal-duree">
            <option value="30">0 h 30</option>
            <option value="60" selected>1 h 00</option>
            <option value="90">1 h 30</option>
            <option value="120">2 h 00</option>
            <option value="150">2 h 30</option>
            <option value="180">3 h 00</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Positionner un groupe (Classe)</label>
        <select id="modal-classe">
          <option value="">-- Aucun groupe automatique --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ou positionner un élève individuel</label>
        <select id="modal-eleve">
          <option value="">-- Aucun élève --</option>
        </select>
      </div>

      <div class="modal-actions">
        <button id="btn-delete" class="btn btn-danger" style="display:none;" onclick="deleteSession()">Supprimer</button>
        <div style="display:flex; gap:8px; margin-left:auto;">
          <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="saveSession()">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    let rawSeances = [];
    let officialEvents = [];
    let elevesList = [];
    let selectedDateStr = "";

    function toGristSec(d) { return Math.floor(d.getTime() / 1000); }
    function fromGristDate(v) {
      if (!v) return null;
      return typeof v === 'number' ? new Date(v * 1000) : new Date(v);
    }
    function addDays(d, n) {
      const res = new Date(d);
      res.setDate(res.getDate() + n);
      return res;
    }

    // Génère les créneaux de 08h00 à 18h30 par pas de 30 min
    function buildTimeSlots() {
      const select = document.getElementById('modal-time-start');
      select.innerHTML = '';
      for (let h = 8; h <= 18; h++) {
        for (let m of [0, 30]) {
          const hh = String(h).padStart(2, '0');
          const mm = String(m).padStart(2, '0');
          const val = `${hh}:${mm}`;
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = `${hh} h ${mm}`;
          select.appendChild(opt);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      buildTimeSlots();

      // Gestion de l'affichage du champ "Nouvelle activité"
      const actSelect = document.getElementById('modal-activite');
      actSelect.addEventListener('change', function() {
        const isNew = this.value === '__NEW__';
        document.getElementById('group-new-activite').style.display = isNew ? 'block' : 'none';
        if (isNew) document.getElementById('new-activite-nom').focus();
      });

      // Décocher l'élève si une classe est sélectionnée
      document.getElementById('modal-classe').addEventListener('change', function() {
        if (this.value) document.getElementById('modal-eleve').value = "";
      });

      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        locale: 'fr',
        initialView: 'timeGridWeek',
        firstDay: 1,
        slotMinTime: '08:00:00',
        slotMaxTime: '19:00:00',
        slotDuration: '00:30:00',
        allDaySlot: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay'
        },
        buttonText: { today: "Aujourd'hui", week: 'Semaine', day: 'Jour' },
        editable: true,
        selectable: true,

        select: function(info) {
          openCreateModal(info);
          calendar.unselect();
        },
        eventClick: function(info) {
          if (info.event.display === 'background' || String(info.event.id).startsWith('off_')) return;
          openEditModal(info.event.id);
        },
        eventDrop: function(info) { updateTimes(info.event); },
        eventResize: function(info) { updateTimes(info.event); }
      });

      calendar.render();

      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'Debut', title: 'Début' },
          { name: 'Fin', title: 'Fin' },
          { name: 'Titre', title: 'Titre' }
        ]
      });

      loadReferences();

      grist.onRecords(function(records) {
        rawSeances = records;
        populateActivityList();
        refreshCalendar();
      });
    });

    // Remplit la liste déroulante avec TOUTES les activités déjà utilisées dans Seances et Type_Activites
    async function populateActivityList() {
      const distinctNames = new Set();

      // 1. Activités déjà saisies dans la table Seances
      rawSeances.forEach(r => {
        if (r.Titre && r.Titre.trim() !== '') distinctNames.add(r.Titre.trim());
      });

      // 2. Activités déclarées dans Type_Activites
      try {
        const acts = await grist.docApi.fetchTable('Type_Activites');
        for (let key in acts) {
          if (Array.isArray(acts[key])) {
            acts[key].forEach(val => {
              if (typeof val === 'string' && val.trim() !== '' && key !== 'id') {
                distinctNames.add(val.trim());
              }
            });
          }
        }
      } catch (e) {}

      const actSelect = document.getElementById('modal-activite');
      const currentSelected = actSelect.value;
      actSelect.innerHTML = '<option value="">-- Choisir une activité --</option><option value="__NEW__">➕ Créer une nouvelle activité...</option>';

      Array.from(distinctNames).sort().forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        actSelect.appendChild(opt);
      });

      if (currentSelected) actSelect.value = currentSelected;
    }

    async function loadReferences() {
      try {
        // Vacances et jours fériés
        const off = await grist.docApi.fetchTable('Calendrier_Officiel');
        officialEvents = [];
        for (let i = 0; i < off.id.length; i++) {
          const deb = fromGristDate(off.Date_Debut[i]);
          const fin = fromGristDate(off.Date_Fin[i]) || deb;
          const nom = off.Nom ? off.Nom[i] : 'Fermeture';
          const type = off.Type ? off.Type[i] : '';
          const isVac = (type === 'Vacances scolaires' || type === 'Vacances');

          if (deb) {
            const finInclusive = addDays(fin, 1);
            officialEvents.push({
              id: 'off_bg_' + off.id[i],
              start: deb, end: finInclusive,
              allDay: true, display: 'background',
              className: isVac ? 'bg-vacances' : 'bg-ferie'
            });
            officialEvents.push({
              id: 'off_lbl_' + off.id[i],
              title: (isVac ? '🏖️ ' : '🔴 ') + nom,
              start: deb, end: addDays(deb, 1),
              allDay: true, editable: false,
              backgroundColor: isVac ? '#fff3cd' : '#f8d7da',
              textColor: '#333333', borderColor: isVac ? '#ffeeba' : '#f5c6cb'
            });
          }
        }

        // Liste des élèves et classes
        const elvs = await grist.docApi.fetchTable('Eleves');
        elevesList = [];
        const classesSet = new Set();
        const eleveSelect = document.getElementById('modal-eleve');
        eleveSelect.innerHTML = '<option value="">-- Aucun élève --</option>';

        for (let i = 0; i < elvs.id.length; i++) {
          const init = elvs.Initiales ? elvs.Initiales[i] : (elvs.Prenom[i] + ' ' + elvs.Nom[i]);
          const classe = elvs.Classe ? elvs.Classe[i] : '';
          elevesList.push({ id: elvs.id[i], initiales: init, classe: classe });
          if (classe) classesSet.add(classe);

          const opt = document.createElement('option');
          opt.value = elvs.id[i];
          opt.textContent = init + (classe ? ` (${classe})` : '');
          eleveSelect.appendChild(opt);
        }

        const classeSelect = document.getElementById('modal-classe');
        classeSelect.innerHTML = '<option value="">-- Aucun groupe automatique --</option>';
        Array.from(classesSet).sort().forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = 'Toute la classe ' + c;
          classeSelect.appendChild(opt);
        });

        refreshCalendar();
      } catch (e) {
        console.warn("Accès docApi restreint :", e);
      }
    }

    function refreshCalendar() {
      calendar.removeAllEvents();
      calendar.addEventSource(officialEvents);

      const seanceEvents = rawSeances.map(r => {
        const row = grist.mapColumnNames ? grist.mapColumnNames(r) : r;
        const d = fromGristDate(row.Debut || r.Debut);
        const f = fromGristDate(row.Fin || r.Fin);
        return {
          id: String(r.id),
          title: (row.Titre || r.Titre || 'Séance') + (r.Lieu ? ' [' + r.Lieu + ']' : ''),
          start: d,
          end: f,
          backgroundColor: '#1f4e79',
          borderColor: '#163857'
        };
      }).filter(e => e.start && e.end);

      calendar.addEventSource(seanceEvents);
    }

    function roundTo30(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const roundedM = m < 30 ? '00' : '30';
      return `${String(h).padStart(2, '0')}:${roundedM}`;
    }

    function openCreateModal(info) {
      document.getElementById('edit-id').value = "";
      document.getElementById('modal-title').textContent = "Programmer une séance";
      document.getElementById('modal-activite').value = "";
      document.getElementById('group-new-activite').style.display = 'none';
      document.getElementById('new-activite-nom').value = "";
      document.getElementById('modal-lieu').value = "UJPE";
      document.getElementById('modal-classe').value = "";
      document.getElementById('modal-eleve').value = "";
      document.getElementById('btn-delete').style.display = 'none';

      selectedDateStr = info.startStr.split('T')[0];
      const rawTime = info.startStr.split('T')[1].substring(0, 5);
      document.getElementById('modal-time-start').value = roundTo30(rawTime);

      const diffMin = Math.round((info.end - info.start) / 60000);
      const dureeSelect = document.getElementById('modal-duree');
      dureeSelect.value = (diffMin >= 30 && diffMin <= 180) ? String(diffMin) : "60";

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openEditModal(rowId) {
      const record = rawSeances.find(r => String(r.id) === String(rowId));
      if (!record) return;

      document.getElementById('edit-id').value = rowId;
      document.getElementById('modal-title').textContent = "Modifier la séance";
      document.getElementById('btn-delete').style.display = 'block';

      const d = fromGristDate(record.Debut);
      const f = fromGristDate(record.Fin);
      selectedDateStr = d.toISOString().split('T')[0];

      const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      document.getElementById('modal-time-start').value = roundTo30(timeStr);

      const diffMin = Math.round((f - d) / 60000);
      document.getElementById('modal-duree').value = (diffMin >= 30 && diffMin <= 180) ? String(diffMin) : "60";

      document.getElementById('modal-activite').value = record.Titre || "";
      document.getElementById('group-new-activite').style.display = 'none';
      document.getElementById('modal-lieu').value = record.Lieu || "UJPE";
      document.getElementById('modal-classe').value = "";
      document.getElementById('modal-eleve').value = "";

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    async function saveSession() {
      let titre = document.getElementById('modal-activite').value;
      if (titre === '__NEW__') {
        titre = document.getElementById('new-activite-nom').value.trim();
        if (!titre) { alert("Veuillez saisir un nom d'activité."); return; }
        try {
          await grist.docApi.applyUserActions([
            ['AddRecord', 'Type_Activites', null, { Nom: titre }]
          ]);
        } catch (e) {}
      }
      if (!titre) { alert("Veuillez choisir ou saisir une activité."); return; }

      const lieu = document.getElementById('modal-lieu').value;
      const tStart = document.getElementById('modal-time-start').value;
      const dureeMin = parseInt(document.getElementById('modal-duree').value, 10);

      const debDate = new Date(selectedDateStr + 'T' + tStart + ':00');
      const finDate = new Date(debDate.getTime() + dureeMin * 60000);

      const editId = document.getElementById('edit-id').value;
      let seanceId = editId ? parseInt(editId) : null;

      if (seanceId) {
        await grist.selectedTable.update({
          id: seanceId,
          fields: { Titre: titre, Lieu: lieu, Debut: toGristSec(debDate), Fin: toGristSec(finDate) }
        });
      } else {
        const res = await grist.selectedTable.create({
          fields: { Titre: titre, Lieu: lieu, Debut: toGristSec(debDate), Fin: toGristSec(finDate) }
        });
        seanceId = res.id;
      }

      const classe = document.getElementById('modal-classe').value;
      const eleveId = document.getElementById('modal-eleve').value;

      if (classe) {
        const inscrits = elevesList.filter(e => e.classe === classe);
        const actions = inscrits.map(e => ['AddRecord', 'Inscriptions', null, { Seance: seanceId, Eleve: e.id }]);
        if (actions.length) await grist.docApi.applyUserActions(actions);
      } else if (eleveId) {
        await grist.docApi.applyUserActions([
          ['AddRecord', 'Inscriptions', null, { Seance: seanceId, Eleve: parseInt(eleveId) }]
        ]);
      }

      closeModal();
      populateActivityList();
    }

    async function deleteSession() {
      const editId = document.getElementById('edit-id').value;
      if (!editId) return;
      if (confirm("Supprimer cette séance ?")) {
        await grist.selectedTable.destroy([parseInt(editId)]);
        closeModal();
      }
    }

    function updateTimes(event) {
      grist.selectedTable.update({
        id: parseInt(event.id),
        fields: {
          Debut: toGristSec(event.start),
          Fin: toGristSec(event.end)
        }
      });
    }
  </script>
</body>
</html>
